# ==============================================================================
# DXVK ULTRA PERFORMANCE CONFIG FOR GODDESS OF VICTORY: NIKKE (Intel iGPU)
# ==============================================================================

# 1. Disable Nvidia NVAPI Hack (Critical for Intel/AMD iGPUs in Unity Engine)
dxgi.nvapiHack = False

# 2. Graphics Pipeline Library (GPL) & Multi-Threaded Async Shader Compiler
dxvk.gplPipelineLibrary = True
dxvk.numCompilerThreads = 8

# 3. Disable VSync & Uncap Frame Rate
dxgi.syncInterval = 0
dxvk.tearFree = False

# 4. Direct3D 11 Ultra Optimization Flags for Intel iGPU
# Disable Heavy Tessellation (30-50% FPS boost on Intel Iris/UHD 32 EU iGPU)
d3d11.maxTessellationFactor = 0

# Fast buffer mapping, single draw calls & relaxed sync barriers
d3d11.allowMapFlagNoWait = True
d3d11.relaxedBarriers = True
d3d11.zeroCapacityIndirectForDraw = True
d3d11.invariantPosition = True
d3d11.dcSingleUse = True
d3d11.constantBufferUpdateMode = a

# 5. Raw Buffer Namespace & Shared VRAM Limiter (Prevents System RAM Thrashing)
dxvk.useRawBufferNamespace = True
dxgi.maxDeviceMemory = 2048
